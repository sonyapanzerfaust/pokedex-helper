name: Publish portable release
on:
  push:
    branches: [main]
    paths: ['runtime/resources/app/package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - run: node scripts/locale-checks.cjs
      - if: runner.os == 'Windows'
        run: |
          node scripts/verify.cjs
          node scripts/portable-checks.cjs
          node scripts/recovery-checks.cjs
      - run: node scripts/build.cjs ${{ matrix.target }}
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends x11-utils
          mkdir "$RUNNER_TEMP/extracted"
          tar -xf dist/*-linux-x64.tar.gz -C "$RUNNER_TEMP/extracted"
          cd "$RUNNER_TEMP/extracted/PokedexHelper"
          test -x PokedexHelper
          test -d data
          node -e "require('./resources/app/portable.cjs').initialize(require('node:path').resolve('data')).catch(e => { console.error(e); process.exitCode = 1; })"
          dbus-run-session -- xvfb-run -a bash -eu -c '
            ./PokedexHelper --ozone-platform=x11 >"$RUNNER_TEMP/helper.log" 2>&1 &
            pid=$!
            trap "kill $pid || true" EXIT
            for i in {1..30}; do
              kill -0 "$pid" || { cat "$RUNNER_TEMP/helper.log"; exit 1; }
              if xwininfo -root -tree | grep -i "Platinum"; then exit 0; fi
              sleep 1
            done
            xwininfo -root -tree
            cat "$RUNNER_TEMP/helper.log"; exit 1'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/Pokedex-Helper-*-portable-${{ matrix.target }}.*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c *.sha256
          version=$(node -p "require('../runtime/resources/app/package.json').version")
          tag="v${version%.0}"
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Pokédex Helper ${tag#v}" --notes-file ../RELEASE-NOTES.md *.zip *.tar.gz *.sha256
