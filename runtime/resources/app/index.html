<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'"><title>Pokédex Helper · Platinum</title><link rel="stylesheet" href="style.css"></head>
<body><aside><div class="brand"><img alt="" src="art/notebook.svg"><strong>Pokédex Helper</strong><button id="compact" type="button">◧</button></div>
<section class="game-controls"><label for="donorSelect" data-i18n="navigation.game_to_launch">Game to launch</label><div class="game-picker"><select id="donorSelect"></select></div><button class="primary" id="play" data-i18n="navigation.launch_game">▶ Launch game</button><small id="launchHint"></small></section>
<nav aria-label="Controls" data-aria-label="navigation.controls"><button id="routeNav">⌖ Route</button><button id="setup" data-i18n="navigation.settings">⚙ Settings</button><button id="backups" data-i18n="navigation.backups">▤ Backups</button><div class="file-actions"><button id="export" data-i18n="navigation.export">↑ Export</button><button id="import" data-i18n="navigation.import">↓ Import</button></div></nav>
</aside><main><p id="pageStatus" role="status"></p><section id="routePage"><header><div class="campaign"><small id="campaignLabel"></small><h1 data-i18n="navigation.national_pok_dex">National Pokédex</h1></div><div class="overview">
<section class="collection"><h2 data-i18n="navigation.platinum_collection">Platinum collection</h2><div class="totals"><strong id="caught">—</strong><span>/ 493</span><small data-i18n="navigation.seen">Seen <b id="seen">—</b></small></div><progress id="progress" max="493" value="0" aria-label="National Dex progress" data-aria-label="navigation.national_dex_progress"></progress>
<p data-i18n="navigation.story_tasks">Story tasks <b id="manual">—</b></p><small id="syncBadge"></small></section>
<section class="now"><h2 data-i18n="renderer.current_stage">Current stage</h2><strong id="currentStage">—</strong><small id="stageRemaining"></small></section><div class="objective"><small id="objectiveLabel"></small><p id="nextTask"></p><button id="jump"></button></div></div>

<details id="team"><summary data-i18n="navigation.party_and_pc_boxes">Party and PC Boxes</summary><div id="roster"></div></details>
<details id="diagnostics" hidden><summary data-i18n="navigation.save_diagnostics">Save diagnostics</summary><p id="source"></p><p id="status" role="status"></p></details><p id="actionError" role="alert"></p></header>
<h2 class="route-heading" data-i18n="navigation.playthrough_route">Playthrough route</h2><div class="toolbar"><input id="search" placeholder="Name, number or location…" data-placeholder="navigation.name_number_or_location" aria-label="Search" data-aria-label="navigation.search"><select id="filter" data-aria-label="navigation.filter_tasks"><option value="all" data-i18n="navigation.all_tasks">All tasks</option><option value="missing" data-i18n="navigation.still_missing">Still missing</option><option value="caught" data-i18n="pokedex.caught">Caught</option><option value="seen" data-i18n="navigation.seen_only">Seen only</option><option value="donor" data-i18n="navigation.obtained_in_donor">Obtained in donor</option><option value="done" data-i18n="navigation.completed">Completed</option><option value="available" id="availableFilter"></option><option value="deferred" id="deferredFilter"></option></select><button id="currentNav"></button><button id="expand" data-i18n="navigation.expand_all">Expand all</button></div>
<div id="sections"></div></section><section id="settingsPage" class="workpage" hidden><h1></h1><div id="settingsTabs" role="tablist"></div><div id="settingsContent" role="tabpanel"></div></section><section id="backupsPage" class="workpage" hidden><h1></h1><div id="backupContent"></div></section></main>
<dialog id="wizard" aria-labelledby="wizardTitle"><form method="dialog"><button aria-label="Close" data-aria-label="navigation.close">×</button></form><p id="step"></p><h2 id="wizardTitle"></h2><div id="choices"></div><p id="wizardError" role="status"></p><footer><button id="prev" data-i18n="navigation.back">Back</button><button id="next" class="primary" data-i18n="renderer.next">Next</button></footer></dialog>
<dialog id="detail" aria-labelledby="detailTitle"><form method="dialog"><button data-i18n="navigation.close">Close</button></form><h2 id="detailTitle"></h2><div id="detailBody"></div></dialog>
<script src="locales/en.js"></script><script src="locales/ru.js"></script><script src="i18n.js"></script><script src="acquisition.js"></script>
  <script src="approved.js"></script><script src="encounter.js"></script><script src="management-words.js"></script><script src="management-ui.js"></script><script src="field-art.js"></script><script src="renderer.js"></script></body></html>
